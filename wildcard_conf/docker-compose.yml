services:
  traefik:
    image: traefik:langres    # = branche v3.7 (le codename suit la mineure : patchs oui, 3.8 non).
                              # 3.6 -> 3.7 le 2026-11-21 (ramequin -> langres), comme la stack racine (guide de migration : rien pour docker/file/acme).
                              # Ne pas remplacer par v3/latest : sauterait de mineure sans prévenir.
    container_name: traefik-wildcard
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./traefik_dynamic.yml:/traefik_dynamic.yml:ro
      - ./traefik_logs:/var/log/traefik
    # Clés d'API DNS-01 (OVH, Gandi) lues par lego. Voir .env.example.
    env_file: .env
    networks:
      - frontend
    depends_on:
      crowdsec:
        condition: service_healthy   # le plugin bouncer a besoin du LAPI dès le démarrage
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]   # nécessite `ping: {}` dans traefik.yml
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:                # plafonne le stdout de Traefik (access.log est géré par logrotate)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  crowdsec:
    image: crowdsecurity/crowdsec:latest   # màj : vérifier https://github.com/crowdsecurity/crowdsec/releases
    container_name: crowdsec
    restart: unless-stopped
    volumes:
      - ./traefik_logs:/var/log/traefik:ro # montage des logs traefik
      - ./crowdsec/config:/etc/crowdsec/
      - ./crowdsec/data:/var/lib/crowdsec/data
    environment:
      - TZ=Europe/Paris
    networks:
      - frontend    # pour que le plugin Traefik puisse joindre l’API LAPI
    # On ne publie pas de port (usage interne à Docker réseau)
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s   # 1er démarrage : téléchargement du hub
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  logrotate:
    image: blacklabelops/logrotate:latest   # dernier tag publié (2019), == latest. Image non maintenue.
    container_name: logrotate
    restart: unless-stopped
    environment:
      - LOGS_DIRECTORIES=/var/log/traefik
      - LOGROTATE_INTERVAL=daily
      - LOGROTATE_COPIES=7
    volumes:
      - ./traefik_logs:/var/log/traefik
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Relais du journal d'acces vers la supervision. Traefik ecrit ses requetes
  # dans un FICHIER (CrowdSec le lit, on n'y touche pas) : ce conteneur le relit
  # et recopie chaque nouvelle ligne sur SA sortie, que l'agent de supervision
  # de l'hote ramasse. Le label indique le format a l'agent : il decoupe le JSON
  # en champs et l'envoie dans le flux « acces_web ».
  #   -n 0 : seulement les nouvelles lignes ; -F : suit le fichier apres rotation ;
  #   lecture seule, aucun reseau.
  #   tail de GNU (debian) et PAS busybox : apres le copytruncate de logrotate
  #   (fichier vide sur place), busybox reprend a son ancienne position et perd
  #   le debut de la journee ; GNU detecte « file truncated » (teste).
  # Sans agent de supervision sur l'hote, ce conteneur ne sert a rien (sans risque).
  # Contient les IP des visiteurs.
  traefik-access:
    image: debian:13-slim
    restart: unless-stopped
    command: ["tail", "-q", "-n", "0", "-F", "/var/log/traefik/access.log"]
    volumes:
      - ./traefik_logs:/var/log/traefik:ro
    network_mode: none
    labels:
      - supervision.format=traefik-json
    healthcheck:
      # Pas de pgrep dans debian slim : on verifie que le journal reste lisible
      # (si tail meurt, le conteneur s'arrete et redemarre tout seul).
      test: ["CMD", "test", "-r", "/var/log/traefik/access.log"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
    external: true


