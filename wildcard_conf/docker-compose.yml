services:
  traefik:
    image: traefik:ramequin
    container_name: traefik-wildcard
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./traefik_dynamic.yml:/traefik_dynamic.yml:ro
      - ./traefik_logs:/var/log/traefik
    # Clés d'API DNS-01 (OVH, Gandi) lues par lego. Voir .env.example.
    env_file: .env
    networks:
      - frontend
    logging:                # plafonne le stdout de Traefik (access.log est géré par logrotate)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: always
    volumes:
      - ./traefik_logs:/var/log/traefik:ro # montage des logs traefik
      - ./crowdsec/config:/etc/crowdsec/
      - ./crowdsec/data:/var/lib/crowdsec/data
    environment:
      - TZ=Europe/Paris
    networks:
      - frontend    # pour que le plugin Traefik puisse joindre l’API LAPI
    # On ne publie pas de port (usage interne à Docker réseau)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  logrotate:
    image: blacklabelops/logrotate
    environment:
      - LOGS_DIRECTORIES=/var/log/traefik
      - LOGROTATE_INTERVAL=daily
      - LOGROTATE_COPIES=7
    volumes:
      - ./traefik_logs:/var/log/traefik
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
    external: true


# tuto : https://blog.levassb.ovh/post/crowdsec/

