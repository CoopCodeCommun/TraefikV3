# Code Commun : ban au PREMIER essai d'un fichier de secrets ou d'un outil
# d'admin connu (/.env, /.git/, /.aws/, phpinfo.php, phpmyadmin...).
# Aucune page de nos services ne sert ces chemins : sur 15 jours de prod
# Lespass (2026-11-07 -> 22), 69 000 requetes de 858 IP, aucune d'un vrai
# visiteur. Les scenarios du hub (http-sensitive-files...) attendent plusieurs
# essais : celui-ci coupe le scanner des la 1re sonde, avant qu'il n'essaie
# les 200 autres chemins de sa liste.
# Motif volontairement etroit (faux positifs vus le 22/11 en relisant) :
#  - a la racine ou a 3 dossiers au plus (/.env, /backend/.env, /var/www/html/.env) :
#    un fichier .env ou .git/ AFFICHE dans Forgejo (/user/depot/src/branch/main/.env)
#    ou synchronise par WebDAV dans Nextcloud (/remote.php/dav/files/...) est plus
#    profond et ne compte pas ;
#  - nom exact : .git/ ou .env.local oui, .gitignore / .github / .dockerignore non ;
#  - WebDAV de Nextcloud (/remote.php/..., /public.php/...) exclu d'office ;
#  - un clone git (/Jonas/depot.git/info/refs) ne compte pas (pas de / avant le point).
# PAS wp-content / wp-login : des liens vers un ancien WordPress (lamiete.com,
# fairefestival.fr) trainent encore chez de vrais visiteurs.
type: trigger
name: codecommun/sonde-secrets
description: "Ban au premier essai d'un fichier de secrets ou d'un outil d'admin connu"
filter: |
  evt.Meta.log_type in ['http_access-log', 'http_error-log'] &&
  !(evt.Meta.http_path matches '^/(remote|public)\\.php/') &&
  evt.Meta.http_path matches '(?i)^/([^/?#]+/){0,3}(\\.(env|git|aws|ssh|svn|hg|docker|dockercfg|dockerenv|gitmodules|kube|npmrc|pypirc|htpasswd|ds_store|vault_pass|ansible|b2_account_info)([/.~_?#%-]|$)|\\.mc/|wp-config\\.php|phpinfo\\.php|phpmyadmin|etc/passwd|vendor/phpunit|actuator/|server-status|_profiler/|cgi-bin/)'
groupby: evt.Meta.source_ip
blackhole: 1m
labels:
  remediation: true
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1595
  behavior: "http:scan"
  label: "Sonde de fichier de secrets"
  service: http
