## Static configuration

log:
  level: INFO   # défaut Traefik = ERROR. DEBUG pour diagnostiquer un souci ACME.

ping: {}        # endpoint /ping sur l'entryPoint interne "traefik" (:8080), non publié.
                # Requis par le healthcheck du docker-compose.

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: frontend # docker network create frontend
    exposedByDefault: false # containers that do not have a traefik.enable=true label are ignored 

  file:
    filename: /traefik_dynamic.yml
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections: # enable redirecting of all incoming requests on 80 to 443
        entryPoint:
          to: websecure
  websecure:
    address: ":443"
    http:
      middlewares:
        - crowdsec@file

certificatesResolvers:
  myresolver:
    acme:
      # caserver: "https://acme-staging-v02.api.letsencrypt.org/directory" # for staging server
      tlsChallenge: {}
      email: jturbeaux@pm.me
      storage: "/letsencrypt/acme.json"
      # httpchallenge:
        # entryPoint:
          # web


# Ajout plugin CrowdSec
experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.8.1"    # adapte selon version stable sur https://github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
                           # (v1.4.5 -> v1.8.1 le 2026-11-08 ; v1.7.0 : BanHTMLFilePath/CaptchaHTMLFilePath renommes, non utilises ici)


accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  filters:
    statusCodes:
      - "200-299" # log successful http requests
      - "400-599" # log failed http requests
  # collect logs as in-memory buffer before writing into log file
  bufferingSize: 0
  fields:
    headers:
      defaultMode: drop # drop all headers per default
      names:
          User-Agent: keep # log user agent strings


  